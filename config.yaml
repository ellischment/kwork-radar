# Радар заказов. Все настройки здесь, скрипт менять не нужно.

# Публичный канал в Telegram, который репостит заказы с биржи.
# Укажи имя без @, например: kwork_orders
channel: "freelance_dev_work"

# Сколько последних постов проверять за один запуск (хватает с запасом при кроне раз в 5 минут).
lookback_posts: 25

# Минимальный верхний бюджет заказа, рубли. Ниже порога заказ не показывается.
min_budget: 7000

# Теги, которые берём. Пост без этих тегов пропускается.
tags_allow:
  - "#верстка"
  - "#скрипты_боты_miniapp"
  - "#доработка_настройка_сайта"
  - "#десктоп_программирование"
  - "#разработка_сайта"
  - "#сайт_под_ключ"
  - "#парсинг"
  - "#нейросети"

# Стоп-слова. Если встречаются в тексте, заказ отбраковывается сразу.
stop_words:
  - "мод на "
  - "мод для"
  - "майнкрафт"
  - "minecraft"
  - "чит"
  - "накрут"
  - "аудитори"
  - "подробности в лс"
  - "по войсу"
  - "дискорд"
  - "1с "
  - "1с:"
  - "битрикс24"

# Провайдер черновиков. "openai_compat" работает с любым API формата OpenAI,
# "anthropic" с прямым API Claude. Примеры настроек ниже.
provider: "openai_compat"
base_url: "https://api.deepseek.com"   # DeepSeek. Другие варианты в README
model: "deepseek-chat"
#
# OpenRouter:  base_url "https://openrouter.ai/api/v1", model "anthropic/claude-haiku-5-5" или "deepseek/deepseek-chat"
# Прямой Claude: provider "anthropic", model "claude-haiku-5-5"

# Если false, скрипт только фильтрует и присылает заказ без черновика (API не нужен).
draft_enabled: false

# Профиль для черновика отклика. Пиши от первого лица, это читает модель.
profile: |
  Я Василиса, самозанятая, веб-разработчик и Python-разработчик, Москва.
  Делаю сайты с онлайн-записью и админками под ключ, адаптивную вёрстку, Python-сервисы,
  автоматизацию (Playwright, парсинг, боты), проекты на стыке AI и бизнеса
  (n8n, LLM-ассистенты, базы знаний). Опыт в ML и количественных торговых стратегиях.
  Ставка 2 500 ₽ в час до налогов. Небольшие сайты и лендинги делаю за 1–2 недели.
  Пример работы: «Принц и Лис», сайт керамической студии с онлайн-бронированием и админкой.
  Ссылка на портфолио: https://ellischment.com

# Правила текста отклика.
rules: |
  Правила отклика на Kwork:
  1. Без приветствий и представления. Профиль заказчик видит сам.
  2. Первая строка повторяет задачу своими словами и добавляет одну деталь,
     которой заказчик не писал, но которая показывает понимание (риск, нюанс, подход).
  3. Дальше план в 2–3 шагах с результатом каждого шага и общий срок.
  4. Фиксированная цена в рублях из бюджета заказчика, ближе к верхней границе,
     с указанием что входит. Если задача не влезает в бюджет, предложи первый этап за эту сумму.
  5. Одна ссылка на похожую работу из профиля.
  6. Последняя строка: один точный вопрос, который заставит заказчика ответить.
  7. Длина 5–8 предложений. Короткие фразы. На «вы».
  8. Запрещено длинное тире (—) и конструкции «X — это Y». Используй точку или запятую.
  9. Если заказ сомнительный (нарушение правил площадок, серые схемы, нереальный объём за бюджет),
     в оценке напиши об этом прямо.
