# Радар заказов. Все настройки здесь, скрипт менять не нужно.

# Публичный канал в Telegram, который репостит заказы с биржи.
# Укажи имя без @, например: kwork_orders
channel: "freelance_dev_work"

# Сколько последних постов проверять за один запуск (хватает с запасом при кроне раз в 5 минут).
lookback_posts: 25

# Минимальный верхний бюджет заказа, рубли. Ниже порога заказ не показывается.
min_budget: 7000

# Теги, которые берём. Пост без этих тегов пропускается.
tags_allow:
  - "#верстка"
  - "#скрипты_боты_miniapp"
  - "#доработка_настройка_сайта"
  - "#десктоп_программирование"
  - "#разработка_сайта"
  - "#сайт_под_ключ"
  - "#парсинг"
  - "#нейросети"

# Стоп-слова. Если встречаются в тексте, заказ отбраковывается сразу.
stop_words:
  - "мод на "
  - "мод для"
  - "майнкрафт"
  - "minecraft"
  - "чит"
  - "накрут"
  - "аудитори"
  - "подробности в лс"
  - "по войсу"
  - "дискорд"
  - "1с "
  - "1с:"
  - "битрикс24"

# Провайдер черновиков. "openai_compat" работает с любым API формата OpenAI,
# "anthropic" с прямым API Claude.
provider: "openai_compat"
base_url: "https://openrouter.ai/api/v1"

# Модели перебираются по порядку: если первая недоступна или упёрлась в лимит,
# берётся следующая. Суффикс :free означает нулевую стоимость на OpenRouter.
models:
  - "xingchen-agi/xing4.0-29b-a4b:free"
  - "nvidia/nemotron-3.5-super-vl:free"
  - "deepseek/deepseek-chat-v3-0324:free"
  - "meta-llama/llama-3.3-70b-instruct:free"
#
# Платные варианты, если бесплатных перестанет хватать:
#   OpenRouter:    models: ["anthropic/claude-haiku-5-5"]
#   DeepSeek:      base_url "https://api.deepseek.com", models: ["deepseek-chat"]
#   Прямой Claude: provider "anthropic", models: ["claude-haiku-5-5"]

# Если false, скрипт только фильтрует и присылает заказ без черновика (API не нужен).
draft_enabled: true

# Профиль для черновика отклика. Пиши от первого лица, это читает модель.
profile: |
  Я Василиса, самозанятая, веб-разработчик и Python-разработчик, Москва.
  Делаю сайты с онлайн-записью и админками под ключ, адаптивную вёрстку, Python-сервисы,
  автоматизацию (Playwright, парсинг, боты), проекты на стыке AI и бизнеса
  (n8n, LLM-ассистенты, базы знаний). Опыт в ML и количественных торговых стратегиях.
  Ставка 2 500 ₽ в час до налогов. Небольшие сайты и лендинги делаю за 1–2 недели.
  Пример работы: «Принц и Лис», сайт керамической студии с онлайн-бронированием и админкой.
  Ссылка на портфолио: https://ellischment.com

# Задача модели: только оценка заказа, текст отклика пишем отдельно.
rules: |
  Оцени заказ с точки зрения этого фрилансера. Отклик писать НЕ нужно.
  Критерии:
  - Попадает ли задача в её навыки.
  - Реалистичен ли объём работ под заявленный бюджет при ставке 2 500 ₽/ч.
  - Нет ли признаков проблемного заказа: нарушение правил площадок, накрутка,
    серые схемы, «подробности в ЛС или по войсу», размытое ТЗ, невозможные сроки.
  Пиши коротко и по делу. Короткие фразы. Без длинного тире.
