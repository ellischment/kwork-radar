# Радар заказов. Все настройки здесь, скрипт менять не нужно.

# Публичный канал в Telegram, который репостит заказы с биржи.
# Укажи имя без @, например: kwork_orders
channel: "freelance_dev_work"

# Сколько последних постов проверять за один запуск (хватает с запасом при кроне раз в 5 минут).
lookback_posts: 25

# Минимальный верхний бюджет заказа, рубли. Ниже порога заказ не показывается.
min_budget: 7000

# Теги, которые берём. Пост без этих тегов пропускается.
tags_allow:
  - "#верстка"
  - "#скрипты_боты_miniapp"
  - "#доработка_настройка_сайта"
  - "#десктоп_программирование"
  - "#разработка_сайта"
  - "#сайт_под_ключ"
  - "#парсинг"
  - "#нейросети"

# Стоп-слова. Если встречаются в тексте, заказ отбраковывается сразу.
stop_words:
  - "мод на "
  - "мод для"
  - "майнкрафт"
  - "minecraft"
  - "чит"
  - "накрут"
  - "аудитори"
  - "подробности в лс"
  - "по войсу"
  - "дискорд"
  - "1с "
  - "1с:"
  - "битрикс24"

# Провайдер черновиков. "openai_compat" работает с любым API формата OpenAI,
# "anthropic" с прямым API Claude.
provider: "openai_compat"
base_url: "https://openrouter.ai/api/v1"

# Модели перебираются по порядку: если первая недоступна или упёрлась в лимит,
# берётся следующая. Суффикс :free означает нулевую стоимость на OpenRouter.
models:
  - "xingchen-agi/xing4.0-29b-a4b:free"
  - "nvidia/nemotron-3.5-super-vl:free"
  - "deepseek/deepseek-chat-v3-0324:free"
  - "meta-llama/llama-3.3-70b-instruct:free"
#
# Платные варианты, если бесплатных перестанет хватать:
#   OpenRouter:    models: ["anthropic/claude-haiku-5-5"]
#   DeepSeek:      base_url "https://api.deepseek.com", models: ["deepseek-chat"]
#   Прямой Claude: provider "anthropic", models: ["claude-haiku-5-5"]

# Если false, скрипт только фильтрует и присылает заказ без черновика (API не нужен).
draft_enabled: true

# Профиль для черновика отклика. Пиши от первого лица, это читает модель.
profile: |
  Я Василиса, самозанятая, веб-разработчик и Python-разработчик, Москва.
  Делаю сайты с онлайн-записью и админками под ключ, адаптивную вёрстку, Python-сервисы,
  автоматизацию (Playwright, парсинг, боты), проекты на стыке AI и бизнеса
  (n8n, LLM-ассистенты, базы знаний). Опыт в ML и количественных торговых стратегиях.
  Ставка 2 500 ₽ в час до налогов. Небольшие сайты и лендинги делаю за 1–2 недели.
  ВАЖНО про трудозатраты: реализацию выполняет Claude Code под моим контролем.
  Моё время уходит на постановку задачи, проверку результата, правки, деплой
  и переписку с заказчиком. Руками код я не пишу.
  Пример работы: «Принц и Лис», сайт керамической студии с онлайн-бронированием и админкой.
  Ссылка на портфолио: https://ellischment.com

# Задача модели: только оценка заказа, текст отклика пишем отдельно.
rules: |
  Оцени заказ с точки зрения этого фрилансера. Отклик писать НЕ нужно.
  Критерии:
  - Попадает ли задача в её навыки.
  - Нет ли признаков проблемного заказа: нарушение правил площадок, накрутка,
    серые схемы, «подробности в ЛС или по войсу», размытое ТЗ, невозможные сроки.

  Как считать ЧАСЫ. Это только её собственные часы, не часы разработки.
  Код пишет Claude Code, поэтому считай время на постановку задачи, проверку,
  правки, деплой и общение с заказчиком. Ориентиры:
  - лендинг или вёрстка по готовому макету: 2–4 часа;
  - сайт с формами, админкой или интеграцией: 6–12 часов;
  - сервис или бот со сложной логикой и несколькими интеграциями: 12–25 часов;
  - разовая правка на готовом сайте: 1–2 часа.
  Объём ТЗ увеличивает её часы только там, где нужны её решения и проверка,
  а не пропорционально количеству кода.

  Как считать СТОИМОСТЬ ИНСТРУМЕНТОВ (токены Claude Code). Она растёт вместе
  со сложностью, а не фиксирована. Ориентиры:
  - разовая правка: 2 000 ₽;
  - лендинг или вёрстка по готовому макету: 5 000 ₽;
  - сайт с формами, админкой или интеграцией: 10 000 ₽;
  - сервис или бот со сложной логикой и несколькими интеграциями: 20 000 ₽;
  - долгая отладка чужого кода или legacy: добавь 50 процентов, там много итераций.

  Как считать ЦЕНУ. Сначала посчитай минимум: часы × 2 500 ₽ плюс стоимость
  инструментов. Это себестоимость, ниже неё работать нельзя.
  Затем ставь цену ближе к верхней границе бюджета заказчика, если задача того стоит:
  он платит за результат и срок, а не за её часы. Если верхняя граница бюджета
  ниже минимума, это вердикт «Мимо» по экономике, так и напиши.

  Строка ПОЧЕМУ самая важная. Пиши её по-русски, живой фразой, как коллега,
  который объясняет за пять секунд, чем заказ хорош именно для неё:
  что в нём лёгкого, выгодного или удачно совпадает с её опытом.
  Примеры: «макет готов, остаётся чистая вёрстка, два вечера работы»,
  «её профиль один в один: бронирование и админка, как в Принце и Лисе»,
  «бюджет втрое выше себестоимости, заказчик явно понимает, за что платит».
  Не пиши общих слов вроде «интересный проект» или «подходит по навыкам».
  Если вердикт «Мимо», в ПОЧЕМУ коротко скажи причину, это уйдёт в лог, не ей.

  Пиши коротко и по делу. Короткие фразы. Без длинного тире.

# Радар запущен 18.10.2026.
