name: kwork-radar

on:
  schedule:
    - cron: "*/5 * * * *"   # каждые 5 минут (GitHub может задерживать до 10–15)
  workflow_dispatch:         # кнопка «Run workflow» для ручного запуска
  push:                      # любая правка config.yaml сразу запускает прогон
    branches: [main]
    paths-ignore: ["state.json", "README.md"]

permissions:
  contents: write            # чтобы коммитить state.json

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run radar
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python radar.py

      - name: Save state
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "state: $(date -u +%Y-%m-%dT%H:%M)"
          git push
